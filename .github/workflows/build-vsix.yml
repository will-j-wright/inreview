name: Build VSIX packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: npm run build:production

      - name: Validate the package contents
        run: npm run validate:package

      - name: Create the VSIX
        run: node scripts/package-vsix.mjs

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: inreview-${{ matrix.target }}
          path: inreview-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          retention-days: 14
