[package]
name = "inreview-bridge"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
fs2 = "0.4"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.20", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
